  <script>
    // OpenCV is loaded LAZILY on demand (scanner / facial enrollment pages only).
    // Pages poll window.cvReady === true before using window.cv.
    window.cvReady = false;
    var Module = {
      onRuntimeInitialized: function() {
        window.cvReady = true;
        window.cv = window.cv || cv;
      }
    };
    window.loadOpenCV = function () {
      if (window.cvReady) return Promise.resolve();
      if (!window._cvLoadPromise) {
        window._cvLoadPromise = new Promise(function (resolve) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://docs.opencv.org/4.5.4/opencv.js';
          s.onload = function () {
            // Runtime init is async — resolve once the poll condition can flip.
            var check = setInterval(function () {
              if (window.cvReady) { clearInterval(check); resolve(); }
            }, 200);
          };
          s.onerror = function () { window._cvLoadPromise = null; resolve(); };
          document.head.appendChild(s);
        });
      }
      return window._cvLoadPromise;
    };
  </script>
